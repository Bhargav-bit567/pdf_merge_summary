<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="mx-auto max-w-2xl px-4 py-8 sm:py-12">
      <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">PDF Summarizer</h1>
        <p class="mt-2 text-sm text-slate-400">Private, free, and running on your own machine.</p>
        <p id="status" class="mt-3 inline-flex items-center gap-2 rounded-full bg-slate-800 px-3 py-1 text-xs text-slate-300">
          <span id="status-dot" class="h-2 w-2 rounded-full bg-slate-500"></span>
          <span id="status-text">Checking Ollama...</span>
        </p>
      </header>

      <section class="space-y-4">
        <label id="dropzone" for="file-input" class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-700 bg-slate-900 px-4 py-10 text-center transition hover:border-indigo-400">
          <svg class="mb-3 h-10 w-10 text-indigo-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
          </svg>
          <span id="file-label" class="text-sm font-medium">Tap to choose a PDF, or drop it here</span>
          <span id="file-sub" class="mt-1 text-xs text-slate-500">Max 100 MB | Up to 200+ pages</span>
          <input id="file-input" type="file" accept="application/pdf,.pdf" multiple class="sr-only" />
        </label>

        <div class="flex gap-4">
          <button id="mode-summarize" type="button" class="mode-switch active">Summarize</button>
          <button id="mode-merge" type="button" class="mode-switch">Merge PDFs</button>
        </div>

        <div id="merge-note" class="hidden text-xs text-slate-400 italic">
          Hold Ctrl/Cmd to add more files. Tap to re-order before merging.
        </div>

        <div id="selected-files" class="hidden space-y-2"></div>

        <button id="action-btn" type="button" disabled class="w-full rounded-xl bg-indigo-500 px-4 py-3 font-semibold text-white transition hover:bg-indigo-400 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-400">
          Summarize
        </button>

        <p id="error" class="hidden rounded-xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-200" role="alert"></p>

        <div id="loading" class="hidden items-center gap-3 rounded-xl bg-slate-900 px-4 py-3 text-sm text-slate-300">
          <span class="spinner" aria-hidden="true"></span>
          <span id="loading-text">Working on it...</span>
        </div>
      </section>

      <section id="result" class="mt-8 hidden">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <h2 id="result-title" class="text-lg font-semibold">Summary</h2>
          <div id="result-actions" class="flex gap-2">
            <button id="copy-btn" type="button" class="action-btn">Copy</button>
            <button id="download-btn" type="button" class="action-btn">Download</button>
            <button id="summarize-merged" type="button" class="action-btn hidden">Summarize</button>
          </div>
        </div>
        <p id="meta" class="mb-3 text-xs text-slate-500"></p>
        <article id="summary" class="whitespace-pre-wrap break-words rounded-2xl bg-slate-900 p-4 text-sm leading-relaxed text-slate-200 sm:p-6"></article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
